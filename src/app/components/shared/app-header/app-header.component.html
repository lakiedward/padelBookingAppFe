<header class="header">
  <div class="container header__inner">
    <div class="brand">
      <div class="brand__text">
        <div class="brand__title">PLAYORA</div>
        <div class="brand__subtitle">Sports Club Management Platform</div>
      </div>
    </div>

    <nav class="nav nav--desktop">
      <a class="nav__link" [routerLink]="['/user']" routerLinkActive="nav__link--active" [routerLinkActiveOptions]="{ exact: true }">Courts</a>
      <a class="nav__link" [routerLink]="['/user/clubs']" routerLinkActive="nav__link--active">Clubs</a>
      <a class="nav__link" [routerLink]="['/user/events']" routerLinkActive="nav__link--active">Events</a>
      <a class="nav__link" [routerLink]="['/calendar']" routerLinkActive="nav__link--active">Calendar</a>
    </nav>

    <div class="actions actions--desktop">
      <span class="user-mail">{{ userEmail() }}</span>
      <button class="btn" (click)="logout()">Logout</button>
    </div>

    <button class="btn-icon nav-toggle" aria-label="Toggle menu" (click)="toggleMobile()">
      <svg *ngIf="!mobileOpen" viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6H20M4 12H20M4 18H20" />
      </svg>
      <svg *ngIf="mobileOpen" viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6L18 18M6 18L18 6" />
      </svg>
    </button>
  </div>

  <!-- Mobile menu overlay -->
  <div class="drawer-overlay" *ngIf="mobileOpen" (click)="toggleMobile()"></div>

  <!-- Mobile drawer (slides from right like admin) -->
  <div class="drawer" [class.drawer--open]="mobileOpen">
    <div class="drawer__header">
      <div class="drawer__brand">
        <div class="drawer__logo">PLAYORA</div>
        <div class="drawer__tagline">Sports Club Management</div>
      </div>
      <button class="drawer__close" (click)="toggleMobile()" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6L18 18M6 18L18 6" />
        </svg>
      </button>
    </div>

    <div class="drawer__separator"></div>

    <nav class="drawer__menu">
      <a class="drawer__menu-item" [routerLink]="['/user']" routerLinkActive="drawer__menu-item--active" [routerLinkActiveOptions]="{ exact: true }" (click)="toggleMobile()">
        <span>Courts</span>
      </a>
      <a class="drawer__menu-item" [routerLink]="['/user/clubs']" routerLinkActive="drawer__menu-item--active" (click)="toggleMobile()">
        <span>Clubs</span>
      </a>
      <a class="drawer__menu-item" [routerLink]="['/user/events']" routerLinkActive="drawer__menu-item--active" (click)="toggleMobile()">
        <span>Events</span>
      </a>
      <a class="drawer__menu-item" [routerLink]="['/calendar']" routerLinkActive="drawer__menu-item--active" (click)="toggleMobile()">
        <span>Calendar</span>
      </a>
    </nav>

    <div class="drawer__footer">
      <div class="drawer__separator"></div>
      <div class="drawer__email">{{ userEmail() }}</div>
      <button class="drawer__logout" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </div>
</header>
