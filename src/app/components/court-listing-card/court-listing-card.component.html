<div
  class="card"
  (click)="handleCardClick()"
  (keydown)="onKeyDown($event)"
  role="button"
  tabindex="0"
>
  <div class="media">
    <img [src]="imageError ? fallbackImage : image" [alt]="title" class="media-img" (error)="onImageError()" />
    <div class="media-overlay"></div>
    <div class="media-badge">
      <span class="badge badge--solid">Active</span>
    </div>
    <div class="media-bottom">
      <div class="media-info">
        <div class="emoji">{{ emoji }}</div>
        <div class="titles">
          <div class="title">{{ title }}</div>
          <div class="club">{{ club }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="body">

    <div class="tags">
      <ng-container *ngFor="let t of tags">
        <span *ngIf="t === 'Indoor'" class="badge badge--primary badge--with-icon">
          <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"/>
            <path d="M5 21V7l7-4 7 4v14"/>
            <path d="M9 21v-6h6v6"/>
            <rect x="9" y="9" width="6" height="4" rx="1"/>
          </svg>
          {{ t }}
        </span>
        <span *ngIf="t === 'Outdoor'" class="badge badge--primary badge--with-icon">
          <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="5" r="3"/>
            <path d="M12 1v1"/>
            <path d="M12 8v1"/>
            <path d="M4.22 4.22l.7.7"/>
            <path d="M19.08 4.22l-.7.7"/>
            <path d="M3 12h1"/>
            <path d="M20 12h1"/>
            <path d="M18 18H6"/>
            <path d="M12 18v3"/>
            <path d="M8 18l-2 3"/>
            <path d="M16 18l2 3"/>
          </svg>
          {{ t }}
        </span>
        <span *ngIf="t === 'Heated'" class="badge badge--heated badge--with-icon">
          <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2c-2 3-5 5-5 9a5 5 0 0 0 10 0c0-4-3-6-5-9z"/>
            <path d="M12 15a2 2 0 0 0 2-2c0-1.5-2-3-2-3s-2 1.5-2 3a2 2 0 0 0 2 2z"/>
            <path d="M8 21h8"/>
            <path d="M10 21v-3"/>
            <path d="M14 21v-3"/>
          </svg>
          {{ t }}
        </span>
        <span *ngIf="t === 'Unheated'" class="badge badge--unheated badge--with-icon">
          <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L9 6h6l-3-4z"/>
            <path d="M12 6v4"/>
            <path d="M8 10l4 4 4-4"/>
            <path d="M12 14v2"/>
            <path d="M8 18h8"/>
            <path d="M6 22l2-4"/>
            <path d="M18 22l-2-4"/>
            <path d="M10 22l1-4"/>
            <path d="M14 22l-1-4"/>
          </svg>
          {{ t }}
        </span>
        <span *ngIf="t !== 'Indoor' && t !== 'Outdoor' && t !== 'Heated' && t !== 'Unheated'" class="badge badge--subtle">{{ t }}</span>
      </ng-container>
    </div>

    <div class="availability" *ngIf="mode === 'booking'">Available on {{ availableDate || '—' }}:</div>
    <div class="availability" *ngIf="mode === 'reservation' && availableDate">Your booking is on {{ availableDate }} from:</div>
    <div class="slots" *ngIf="slots && slots.length > 0">
      <span class="chip" *ngFor="let s of slots">{{ s }}</span>
    </div>

    <button class="btn-cta" *ngIf="mode === 'booking'" (click)="onPrimaryAction($event)">{{ isAdmin ? 'View Bookings' : 'Book Now' }}</button>
    <button class="btn-cta" *ngIf="mode === 'reservation'" (click)="onPrimaryAction($event)">View Details</button>
  </div>
</div>
