<div class="page page-gradient-bg bg-admin-like">
  <section class="hero">
    <div class="glow glow--hero-a"></div>
    <div class="glow glow--hero-b"></div>
    <div class="glow glow--hero-c"></div>

    <div class="container hero__inner">
      <div class="hero__head">
        <h1 class="hero__title">
          <span class="muted">Find Your Perfect </span><span class="accent">Court</span>
        </h1>
        <p class="hero__subtitle">Discover and book premium sports courts at top facilities.</p>
      </div>

      
      <div class="search-filter-bar">
        
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input 
            type="text" 
            placeholder="Search courts by name, location..." 
            class="search-input"
          />
        </div>

        
        <button class="filter-toggle-btn" (click)="toggleFilters()" [class.active]="filtersExpanded">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          <span>Filters</span>
          <span class="filter-badge" *ngIf="getActiveFilterCount() > 0">{{ getActiveFilterCount() }}</span>
        </button>
      </div>

      
      <div class="filters" [class.filters--expandedall]="filtersExpanded">
        <div class="filters-content">
          
          <div class="filters__row">
            <div class="filters__group">
              <div class="filters__label">Sports</div>
              <div class="pills">
                <button class="pill" [class.pill--active]="sportFilter==='all'" (click)="selectSport('all')">All Sports</button>
                <button class="pill" [class.pill--active]="sportFilter==='tennis'" (click)="selectSport('tennis')">Tennis</button>
                <button class="pill" [class.pill--active]="sportFilter==='football'" (click)="selectSport('football')">Football</button>
                <button class="pill" [class.pill--active]="sportFilter==='basketball'" (click)="selectSport('basketball')">Basketball</button>
                <button class="pill" [class.pill--active]="sportFilter==='padel'" (click)="selectSport('padel')">Padel</button>
                <button class="pill" [class.pill--active]="sportFilter==='volleyball'" (click)="selectSport('volleyball')">Volleyball</button>
                <button class="pill" [class.pill--active]="sportFilter==='badminton'" (click)="selectSport('badminton')">Badminton</button>
                <button class="pill" [class.pill--active]="sportFilter==='squash'" (click)="selectSport('squash')">Squash</button>
                <button class="pill" [class.pill--active]="sportFilter==='handball'" (click)="selectSport('handball')">Handball</button>
                <button class="pill" [class.pill--active]="sportFilter==='pingpong'" (click)="selectSport('pingpong')">Ping Pong</button>
              </div>
            </div>
          </div>

          
          <div class="filters__row filters__row--two-groups">
          <div class="filters__group">
            <div class="filters__label">Venue Type</div>
            <div class="pills">
              <button class="pill" [class.pill--active]="venueFilter==='all'" (click)="venueFilter='all'">All Types</button>
              <button class="pill" [class.pill--active]="venueFilter==='indoor'" (click)="venueFilter='indoor'">
                Indoor
              </button>
              <button class="pill" [class.pill--active]="venueFilter==='outdoor'" (click)="venueFilter='outdoor'">
                Outdoor
              </button>
            </div>
          </div>

          <div class="filters__group">
            <div class="filters__label">Heated</div>
            <div class="pills">
              <button class="pill" [class.pill--active]="heatedFilter==='all'" (click)="heatedFilter='all'">All Courts</button>
              <button class="pill" [class.pill--active]="heatedFilter==='heated'" (click)="heatedFilter='heated'">
                Heated
              </button>
              <button class="pill" [class.pill--active]="heatedFilter==='unheated'" (click)="heatedFilter='unheated'">
                Unheated
              </button>
            </div>
          </div>
        </div>

          
          <div class="filters__row filters__row--inputs">
          <div class="filter-row filter-row--first">
            
            <div class="filter-item">
              <label class="filter-label">Location</label>
              <p-select 
                [options]="locationOptions"
                [(ngModel)]="selectedLocation"
                (ngModelChange)="onLocationChange()"
                placeholder="All locations"
                [filter]="true"
                filterPlaceholder="Search locations..."
                [style]="{'width':'100%'}"
                styleClass="custom-dropdown"
                appendTo="body">
              </p-select>
            </div>

            
            <div class="filter-item">
              <label class="filter-label">Sports Club</label>
              <p-select 
                [options]="clubOptions"
                [(ngModel)]="selectedClub"
                placeholder="All clubs"
                [filter]="true"
                filterPlaceholder="Search clubs..."
                [style]="{'width':'100%'}"
                styleClass="custom-dropdown"
                appendTo="body">
              </p-select>
            </div>

            
            <div class="filter-item">
              <label class="filter-label">Sort</label>
              <p-select 
                [options]="sortOptions"
                [(ngModel)]="sortBy"
                optionLabel="label"
                optionValue="value"
                [style]="{'width':'100%'}"
                styleClass="custom-dropdown"
                appendTo="body">
              </p-select>
            </div>
          </div>

          
          <div class="filter-row filter-row--second">
            
            <div class="filter-item">
              <label class="filter-label">Date</label>
              <div class="date-controls">
                <button class="today-btn" [class.active]="isToday()" (click)="setToday()">Today</button>
                <p-datepicker
                  [(ngModel)]="selectedDate"
                  dateFormat="yy-mm-dd"
                  [showIcon]="true"
                  iconDisplay="input"
                  placeholder="Select date"
                  [style]="{'flex':'1'}"
                  styleClass="custom-date-picker"
                  [appendTo]="overlayAppendTarget"
                  (onSelect)="onDateSelect($event)">
                </p-datepicker>
              </div>
            </div>

            
            <div class="filter-item">
              <label class="filter-label">Time</label>
              <div class="time-controls">
                <p-datepicker 
                  [(ngModel)]="timeFrom"
                  [timeOnly]="true"
                  [hourFormat]="'24'"
                  [stepMinute]="1"
                  [readonlyInput]="true"
                  [showIcon]="false"
                  placeholder="From"
                  styleClass="time-input minimal-datepicker"
                  panelStyleClass="minimal-datepicker-panel"
                  [appendTo]="overlayAppendTarget"
                  [style]="{'flex':'1'}">
                </p-datepicker>
                <span class="time-separator">—</span>
                <p-datepicker 
                  [(ngModel)]="timeTo"
                  [timeOnly]="true"
                  [hourFormat]="'24'"
                  [stepMinute]="1"
                  [readonlyInput]="true"
                  [showIcon]="false"
                  placeholder="To"
                  styleClass="time-input minimal-datepicker"
                  panelStyleClass="minimal-datepicker-panel"
                  [appendTo]="overlayAppendTarget"
                  [style]="{'flex':'1'}">
                </p-datepicker>
                <button class="clear-time-btn" type="button" (click)="clearTime()" *ngIf="timeFrom || timeTo" aria-label="Clear time">×</button>
              </div>
            </div>
          </div>
          
          
          <div class="filter-row filter-row--actions">
            <button class="clear-filters-btn" [class.active]="getActiveFilterCount() > 0" (click)="clearAllFilters()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
              <span>Clear All Filters</span>
            </button>
          </div>
          </div>
        </div>
      </div>

      <div class="count" *ngIf="!isLoading">
        <span class="count__num">{{ filtered.length }}</span> courts found
      </div>

      <div class="loading-state" *ngIf="isLoading">
        <div class="spinner"></div>
        <p>Loading courts...</p>
      </div>

      <div class="empty" *ngIf="!isLoading && filtered.length === 0" style="text-align: center; padding: 40px; color: #8aa0b5;">
        No courts available yet. Check back soon!
      </div>

      <div class="grid" *ngIf="!isLoading && filtered.length > 0">
        <app-court-listing-card
          *ngFor="let c of filtered; trackBy: trackByCourtId"
          [image]="c.image"
          [emoji]="c.emoji"
          [title]="c.title"
          [club]="c.club"
          [location]="c.location"
          [price]="c.price"
          unit="per hour"
          [tags]="c.tags"
          [availableDate]="c.availableDate || ''"
          [slots]="c.slots"
          (cardClick)="goToDetail(c.courtId)"
        />
      </div>
    </div>
  </section>
</div>
