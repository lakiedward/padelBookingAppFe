<header class="header" *ngIf="!isAdminRoute">
  <div class="container header__inner">
    <div class="brand">
      <div class="brand__text">
        <div class="brand__title">PLAYORA</div>
        <div class="brand__subtitle">Sports Club Management Platform</div>
      </div>
    </div>

    <nav class="nav nav--desktop">
      <a class="nav__link" [routerLink]="['/courts']" routerLinkActive="nav__link--active">Courts</a>
      <a class="nav__link" [routerLink]="['/clubs']" routerLinkActive="nav__link--active">Clubs</a>
      <a class="nav__link" [routerLink]="['/events']" routerLinkActive="nav__link--active">Events</a>
      <a *ngIf="isAuthenticated()" class="nav__link" [routerLink]="['/calendar']" routerLinkActive="nav__link--active">Calendar</a>
    </nav>

    <div class="actions actions--desktop">
      <ng-container *ngIf="isAuthenticated(); else loginButton">
        <div class="user-profile-dropdown" [class.open]="profileDropdownOpen">
          <button class="user-profile" (click)="toggleProfileDropdown($event)">
            <div class="user-profile__avatar">
              <svg *ngIf="!profileImageUrl()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <img *ngIf="profileImageUrl()" [src]="profileImageUrl()" [alt]="username()" />
            </div>
            <div class="user-profile__info">
              <span class="user-profile__name">{{ username() }}</span>
            </div>
            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          
          <div class="profile-dropdown-menu" *ngIf="profileDropdownOpen">
            <button class="dropdown-item" (click)="goToProfile(); closeProfileDropdown()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span>Edit Profile</span>
            </button>
            <button class="dropdown-item" (click)="logout(); closeProfileDropdown()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </ng-container>
      <ng-template #loginButton>
        <button class="btn btn--login" (click)="goToLogin()">Sign In</button>
      </ng-template>
    </div>

  </div>
</header>


<nav class="bottom-nav" *ngIf="!isAdminRoute">
  <a [routerLink]="['/courts']" routerLinkActive="active" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="3" y1="9" x2="21" y2="9"></line>
      <line x1="9" y1="21" x2="9" y2="9"></line>
    </svg>
    <span>Courts</span>
  </a>
  <a [routerLink]="['/clubs']" routerLinkActive="active" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    <span>Clubs</span>
  </a>
  <a [routerLink]="['/events']" routerLinkActive="active" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
    </svg>
    <span>Events</span>
  </a>
  <a *ngIf="isAuthenticated()" [routerLink]="['/calendar']" routerLinkActive="active" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
    <span>Calendar</span>
  </a>
  <a *ngIf="isAuthenticated()" [routerLink]="['/profile']" routerLinkActive="active" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
    <span>Profile</span>
  </a>
  <a *ngIf="!isAuthenticated()" (click)="goToLogin()" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
      <polyline points="10 17 15 12 10 7"></polyline>
      <line x1="15" y1="12" x2="3" y2="12"></line>
    </svg>
    <span>Sign In</span>
  </a>
</nav>
