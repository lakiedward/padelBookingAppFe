<div class="admin-container page-gradient-bg">

  <header class="topbar">
    <div class="brand">
      <div class="brand-text">
        <div class="brand-title">PLAYORA</div>
      </div>
    </div>

    <div class="separator"></div>

    <div class="page-title">
      {{
        selectedMenu === 'club-management' ? 'Club Management' :
        selectedMenu === 'courts' ? 'Manage Courts' :
        selectedMenu === 'manage-booking' ? 'Manage Booking' :
        'Events'
      }}
    </div>

    <div class="spacer"></div>

    <button class="logout-btn-header" (click)="onLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Logout</span>
    </button>
  </header>

  <main class="content">
    <section class="content-card" *ngIf="selectedMenu === 'club-management'">
      <app-club-details (courtsRequested)="onCourtsRequestedFromChild()" (manageBookingRequested)="onManageBookingFromClub($event)"></app-club-details>
    </section>
    <section class="content-card" *ngIf="selectedMenu === 'courts'">
      <app-court-view
        (addCourt)="onAddCourtFromView()"
        (editCourt)="onEditCourtFromView($event)"
        (viewBookings)="onManageBookingFromCourt($event)">
      </app-court-view>
    </section>
    <section class="content-card" *ngIf="selectedMenu === 'manage-booking'">
      <app-manage-booking [preselectCourtId]="preselectCourtId"></app-manage-booking>
    </section>
    <section class="content-card" *ngIf="selectedMenu === 'events'">
      <app-event-view
        (addEvent)="onAddEventFromView()"
        (editEvent)="onEditEventFromView($event)">
      </app-event-view>
    </section>
  </main>

  <nav class="bottom-nav">
    <button (click)="select('club-management')" [class.active]="selectedMenu === 'club-management'" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Club</span>
    </button>
    <button (click)="select('courts')" [class.active]="selectedMenu === 'courts'" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="9" y1="21" x2="9" y2="9"></line>
      </svg>
      <span>Courts</span>
    </button>
    <button (click)="select('manage-booking')" [class.active]="selectedMenu === 'manage-booking'" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>Bookings</span>
    </button>
    <button (click)="select('events')" [class.active]="selectedMenu === 'events'" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span>Events</span>
    </button>
  </nav>


  <div class="modal-container" *ngIf="showCreateCourtModal">
    <div class="modal-overlay" (click)="onCreateCourtCancel()" aria-hidden="true"></div>
    <div
      class="modal-content"
      role="dialog"
      aria-modal="true"
      aria-label="Create Court"
      (click)="$event.stopPropagation()"
    >
      <app-create-court
        [sports]="getAvailableSports()"
        [courtId]="editingCourtId"
        (cancel)="onCreateCourtCancel()"
        (saved)="onCreateCourtSaved($event)">
      </app-create-court>
    </div>
  </div>


  <div class="modal-container" *ngIf="showCreateEventModal">
    <div class="modal-overlay" (click)="onCreateEventCancel()" aria-hidden="true"></div>
    <div
      class="modal-content"
      role="dialog"
      aria-modal="true"
      aria-label="Create Event"
      (click)="$event.stopPropagation()"
    >
      <app-create-event
        [eventId]="editingEventId"
        (cancelled)="onCreateEventCancel()"
        (saved)="onCreateEventSaved($event)">
      </app-create-event>
    </div>
  </div>
</div>
