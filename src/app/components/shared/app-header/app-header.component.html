<header class="header" *ngIf="!isAdminRoute">
  <div class="container header__inner">
    <div class="brand">
      <div class="brand__text">
        <div class="brand__title">PLAYORA</div>
        <div class="brand__subtitle">Sports Club Management Platform</div>
      </div>
    </div>

    <nav class="nav nav--desktop">
      <a class="nav__link" [routerLink]="['/courts']" routerLinkActive="nav__link--active">Courts</a>
      <a class="nav__link" [routerLink]="['/clubs']" routerLinkActive="nav__link--active">Clubs</a>
      <a class="nav__link" [routerLink]="['/events']" routerLinkActive="nav__link--active">Events</a>
      <a *ngIf="isAuthenticated()" class="nav__link" [routerLink]="['/calendar']" routerLinkActive="nav__link--active">Calendar</a>
    </nav>

    <div class="actions actions--desktop">
      <ng-container *ngIf="isAuthenticated(); else loginButton">
        <div class="user-profile-dropdown" [class.open]="profileDropdownOpen">
          <button class="user-profile" (click)="toggleProfileDropdown($event)">
            <div class="user-profile__avatar">
              <svg *ngIf="!profileImageUrl()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <img *ngIf="profileImageUrl()" [src]="profileImageUrl()" [alt]="username()" />
            </div>
            <div class="user-profile__info">
              <span class="user-profile__name">{{ username() }}</span>
            </div>
            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          
          <div class="profile-dropdown-menu" *ngIf="profileDropdownOpen">
            <button class="dropdown-item" (click)="goToProfile(); closeProfileDropdown()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span>Edit Profile</span>
            </button>
            <button class="dropdown-item" (click)="logout(); closeProfileDropdown()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </ng-container>
      <ng-template #loginButton>
        <button class="btn btn--login" (click)="goToLogin()">Sign In</button>
      </ng-template>
    </div>

    <button class="btn-icon nav-toggle" aria-label="Toggle menu" (click)="toggleMobile()">
      <svg *ngIf="!mobileOpen" viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6H20M4 12H20M4 18H20" />
      </svg>
      <svg *ngIf="mobileOpen" viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6L18 18M6 18L18 6" />
      </svg>
    </button>
  </div>
</header>


<div class="drawer-overlay" *ngIf="mobileOpen" (click)="toggleMobile()"></div>


<div class="drawer" [class.drawer--open]="mobileOpen">
  <nav class="drawer__menu">
    <a class="drawer__menu-item" [routerLink]="['/courts']" routerLinkActive="drawer__menu-item--active" (click)="toggleMobile()">
      <span>Courts</span>
    </a>
    <a class="drawer__menu-item" [routerLink]="['/clubs']" routerLinkActive="drawer__menu-item--active" (click)="toggleMobile()">
      <span>Clubs</span>
    </a>
    <a class="drawer__menu-item" [routerLink]="['/events']" routerLinkActive="drawer__menu-item--active" (click)="toggleMobile()">
      <span>Events</span>
    </a>
    <a *ngIf="isAuthenticated()" class="drawer__menu-item" [routerLink]="['/calendar']" routerLinkActive="drawer__menu-item--active" (click)="toggleMobile()">
      <span>Calendar</span>
    </a>
  </nav>

  <div class="drawer__footer">
    <div class="drawer__separator"></div>
    <ng-container *ngIf="isAuthenticated(); else mobileLoginButton">
      <div class="drawer__user" (click)="goToProfile(); toggleMobile()">
        <div class="drawer__user-avatar">
          <svg *ngIf="!profileImageUrl()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <img *ngIf="profileImageUrl()" [src]="profileImageUrl()" [alt]="username()" />
        </div>
        <div class="drawer__user-info">
          <div class="drawer__user-name">{{ username() }}</div>
        </div>
      </div>
      <button class="drawer__logout" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </ng-container>
    <ng-template #mobileLoginButton>
      <button class="drawer__login" (click)="goToLogin(); toggleMobile()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span>Sign In</span>
      </button>
    </ng-template>
  </div>
</div>
