<div
  class="card"
  (click)="handleCardClick()"
  (keydown)="onKeyDown($event)"
  role="button"
  tabindex="0"
>
  <div class="media">
    <img [src]="imageError ? fallbackImage : image" [alt]="title" class="media-img" (error)="onImageError()" />
    <div class="media-overlay"></div>
    <div class="media-bottom">
      <div class="media-info">
        <img *ngIf="getSportIcon()" [src]="getSportIcon()" [alt]="emoji" class="sport-icon" />
        <div class="titles">
          <div class="title">{{ title }}</div>
          <div class="club">{{ club }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="body">

    <div class="tags">
      <ng-container *ngFor="let t of tags">
        <span *ngIf="t === 'Indoor'" class="badge badge--primary">{{ t }}</span>
        <span *ngIf="t === 'Outdoor'" class="badge badge--primary">{{ t }}</span>
        <span *ngIf="t === 'Heated'" class="badge badge--heated">{{ t }}</span>
        <span *ngIf="t === 'Unheated'" class="badge badge--unheated">{{ t }}</span>
        <span *ngIf="t !== 'Indoor' && t !== 'Outdoor' && t !== 'Heated' && t !== 'Unheated'" class="badge badge--subtle">{{ t }}</span>
      </ng-container>
    </div>

    <div class="availability" *ngIf="mode === 'booking'">Available on {{ availableDate ? ((availableDate + 'T00:00:00') | date:'EEE, MMM d') : '—' }}:</div>
    <div class="availability" *ngIf="mode === 'reservation' && availableDate">Your booking is on {{ (availableDate + 'T00:00:00') | date:'EEE, MMM d' }} from:</div>
    <div class="slots" *ngIf="slots && slots.length > 0">
      <span class="chip" *ngFor="let s of slots">{{ s }}</span>
    </div>

    <button class="btn-cta" *ngIf="mode === 'booking'" (click)="onPrimaryAction($event)">{{ isAdmin ? 'View Bookings' : 'Book Now' }}</button>
    <button class="btn-cta" *ngIf="mode === 'reservation'" (click)="onPrimaryAction($event)">View Details</button>
  </div>
</div>
