<div class="page page-gradient-bg bg-admin-like">
  <section class="profile-section">
    <div class="container profile-container">
      
      <div class="profile-header">
        <h1 class="profile-title">
          <span class="muted">My</span> <span class="accent">Profile</span>
        </h1>
      </div>

      
      <div class="profile-card">
        
        <div class="avatar-section">
          <div class="avatar-container">
            <div class="avatar-wrapper">
              
              <img 
                *ngIf="imagePreview || profileImageUrl()" 
                [src]="imagePreview || profileImageUrl()" 
                [alt]="username()"
                class="avatar-image"
              />
              
              <div *ngIf="!imagePreview && !profileImageUrl()" class="avatar-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
            </div>

            
            <div class="username-display">
              <span *ngIf="!isEditing()">{{ username() }}</span>
              <input 
                *ngIf="isEditing()"
                type="text" 
                class="username-input" 
                [(ngModel)]="username"
                placeholder="Enter your username"
              />
            </div>

            
            <div *ngIf="isEditing()" class="avatar-actions">
              <label class="upload-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <span>Upload Photo</span>
                <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
              </label>
              <button 
                *ngIf="imagePreview || profileImageUrl()" 
                class="remove-btn" 
                (click)="removeImage()"
                type="button"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                <span>Remove</span>
              </button>
            </div>
          </div>
        </div>

        
        <div class="profile-actions">
          
          <button 
            *ngIf="!isEditing()" 
            class="edit-btn" 
            (click)="toggleEdit()"
            type="button"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            <span>Edit Profile</span>
          </button>

          
          <div *ngIf="isEditing()" class="form-actions">
            <button class="btn btn--cancel" (click)="toggleEdit()" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span>Cancel</span>
            </button>
            <button class="btn btn--save" (click)="saveProfile()" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>Save Changes</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
